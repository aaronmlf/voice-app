[workspace]
members = ["crates/*", "apps/*", "xtask"]
exclude = [
    "vendor/accesskit_atspi_common",
    "vendor/accesskit_unix",
    "vendor/atspi-common",
    "vendor/atspi-proxies",
    "vendor/zbus-lockstep",
    "vendor/zbus-lockstep-macros",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/aaronmlf/voice-app"

[workspace.dependencies]
voice-core = { version = "0.1.0", path = "crates/voice-core" }
voice-dsp = { version = "0.1.0", path = "crates/voice-dsp" }
voice-pipewire = { version = "0.1.0", path = "crates/voice-pipewire" }
voice-wasapi = { version = "0.1.0", path = "crates/voice-wasapi" }
voice-library = { version = "0.1.0", path = "crates/voice-library" }
voice-engine = { version = "0.1.0", path = "crates/voice-engine" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"

[patch.crates-io]
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
accesskit_unix = { path = "vendor/accesskit_unix" }
atspi-common = { path = "vendor/atspi-common" }
atspi-proxies = { path = "vendor/atspi-proxies" }

[profile.release]
lto = false
codegen-units = 16

