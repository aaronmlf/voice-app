[workspace]
members = ["crates/*", "apps/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/aaronmlf/voice-app"

[workspace.dependencies]
voice-core = { version = "0.1.0", path = "crates/voice-core" }
voice-dsp = { version = "0.1.0", path = "crates/voice-dsp" }
voice-pipewire = { version = "0.1.0", path = "crates/voice-pipewire" }
voice-library = { version = "0.1.0", path = "crates/voice-library" }
voice-engine = { version = "0.1.0", path = "crates/voice-engine" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"

[profile.release]
lto = false
codegen-units = 16

