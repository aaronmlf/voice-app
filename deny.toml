# cargo-deny policy. `cargo xtask license-check` is a lighter offline metadata
# report; neither command establishes an independent security/legal audit.
[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[licenses]
include-dev = true
include-build = true
confidence-threshold = 0.8
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "BSL-1.0", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016",
    "CC0-1.0", "Unlicense", "OFL-1.1", "Ubuntu-font-1.0",
    # Symphonia: package task includes complete unmodified covered sources/notices.
    "MPL-2.0",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
# Informational maintenance notices: these crates moved into zbus 6.
# Transitive GUI/portal dependencies still use zbus 5. No vulnerability waiver.
# Review by 2026-11-22; the CI deadline gate rejects these exceptions afterward.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant maintenance migration; transitive via GUI/portal zbus 5, awaiting compatible upstream migration to zbus 6. Review by 2026-11-22; see SECURITY.md." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names maintenance migration; transitive via GUI/portal zbus 5, awaiting compatible upstream migration to zbus 6. Review by 2026-11-22; see SECURITY.md." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive maintenance migration; transitive via GUI/portal zbus 5, awaiting compatible upstream migration to zbus 6. Review by 2026-11-22; see SECURITY.md." },
]
