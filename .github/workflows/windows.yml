name: Windows experimental checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_lockfile:
        description: Resolve Cargo.lock only and upload it for review; do not build or release
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '1'
  RUST_TEST_THREADS: '1'

jobs:
  resolve-lock:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_lockfile == true
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default 1.98.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Resolve workspace lockfile without upgrading unrelated dependencies
        run: cargo update --workspace
      - name: Upload proposed lockfile for human/source review
        uses: actions/upload-artifact@v4
        with:
          name: voice-app-proposed-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  check:
    if: inputs.refresh_lockfile != true
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - name: Set up Rust and native build requirements
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default 1.98.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $clang = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $clang 'libclang.dll'))) {
            throw 'The runner must provide LLVM/libclang for Signalsmith bindgen.'
          }
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV
          rustc -vV
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: cargo fetch --locked
      - run: cargo xtask check
      - run: cargo xtask corpus
      - run: cargo xtask bench
      - run: cargo xtask license-check
      - run: cargo xtask package
      - name: Verify checksum and extract only the candidate package
        id: candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = @(Get-ChildItem -LiteralPath dist -Filter 'voice-app-*-x86_64-pc-windows-msvc.zip' -File)
          if ($archive.Count -ne 1) { throw 'Expected exactly one Windows candidate archive.' }
          $files = @(Get-ChildItem -LiteralPath dist -File)
          if ($files.Count -ne 2 -or -not (Test-Path -LiteralPath dist/SHA256SUMS.txt)) {
            throw 'Unexpected candidate assets.'
          }
          $line = (Get-Content -LiteralPath dist/SHA256SUMS.txt -Raw).Trim()
          if ($line -cnotmatch '^([a-f0-9]{64})  (voice-app-[^/\\]+-x86_64-pc-windows-msvc\.zip)$') {
            throw 'Invalid checksum file.'
          }
          $expectedHash = $Matches[1]
          if ($Matches[2] -cne $archive[0].Name) { throw 'Checksum filename differs from the candidate.' }
          $stream = [System.IO.File]::OpenRead($archive[0].FullName)
          try {
            $algorithm = [System.Security.Cryptography.SHA256]::Create()
            try {
              $actualHash = [System.BitConverter]::ToString($algorithm.ComputeHash($stream)).Replace('-', '').ToLowerInvariant()
            } finally { $algorithm.Dispose() }
          } finally { $stream.Dispose() }
          if ($actualHash -cne $expectedHash) { throw 'Candidate SHA-256 mismatch.' }
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath target/windows-extracted
          $root = @(Get-ChildItem -LiteralPath target/windows-extracted -Directory)
          if ($root.Count -ne 1) { throw 'Unexpected package root.' }
          "root=$($root[0].FullName)" >> $env:GITHUB_OUTPUT
      - name: Test extracted CLI, DSP, library, IPC and MCP without hardware
        shell: pwsh
        env:
          PACKAGE_ROOT: ${{ steps.candidate.outputs.root }}
        run: |
          & (Join-Path $env:PACKAGE_ROOT 'scripts/test-windows-offline.ps1') `
            -CliPath (Join-Path $env:PACKAGE_ROOT 'voice-cli.exe') `
            -GuiPath (Join-Path $env:PACKAGE_ROOT 'voice-app.exe') `
            -ReportPath target/windows-offline-report.json
      - name: Inspect PE runtime dependencies without opening the GUI
        shell: pwsh
        env:
          PACKAGE_ROOT: ${{ steps.candidate.outputs.root }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -or -not $install) { throw 'MSVC tools not found.' }
          $dumpbin = @(Get-ChildItem -Path "$install\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending)[0].FullName
          foreach ($name in @('voice-app.exe', 'voice-cli.exe')) {
            & $dumpbin /DEPENDENTS (Join-Path $env:PACKAGE_ROOT $name)
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Upload verified Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: voice-app-windows-candidate
          path: |
            dist/voice-app-*-x86_64-pc-windows-msvc.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload offline evidence
        uses: actions/upload-artifact@v4
        with:
          name: voice-app-windows-offline-evidence
          path: target/windows-offline-report.json
          if-no-files-found: error

  wine:
    if: inputs.refresh_lockfile != true
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: voice-app-windows-candidate
          path: dist
      - name: Install isolated Wine and software-rendering test requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64 wine xvfb xauth libgl1-mesa-dri mesa-utils
      - name: Test the same Windows ZIP under Wine without network or audio hardware
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -name 'voice-app-*-x86_64-pc-windows-msvc.zip' -type f)
          test "${#archives[@]}" -eq 1
          mkdir -p target/wine-runtime
          chmod 700 target/wine-runtime
          export XDG_RUNTIME_DIR="$PWD/target/wine-runtime"
          host_netns=$(readlink /proc/self/ns/net)
          sudo --preserve-env=HOME,USER,LOGNAME,PATH,XDG_RUNTIME_DIR unshare --net \
            --setgid "$(id -g)" --setuid "$(id -u)" -- \
            xvfb-run -a -s '-screen 0 1440x900x24 -nolisten tcp' \
            python3 scripts/test-wine.py --archive "${archives[0]}" \
            --checksums dist/SHA256SUMS.txt --output target/wine-validation --host-netns "$host_netns"
      - name: Retain Wine evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-app-windows-wine-evidence
          path: |
            target/wine-validation/report.json
            target/wine-validation/failure.txt
            target/wine-validation/gui.png
            target/wine-validation/logs/
          if-no-files-found: warn
