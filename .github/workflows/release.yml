name: Linux experimental release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New unused Linux tag (vMAJOR.MINOR.PATCH[-suffix])'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Require dispatch from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Select main when running the release workflow.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: version
        name: Validate tag and source version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tomllib
          from pathlib import Path
          tag = os.environ['REQUESTED_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?', tag):
              raise SystemExit('Use a tag in the format vMAJOR.MINOR.PATCH[-suffix]')
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if tag[1:].split('-')[0] != version.split('-')[0]:
              raise SystemExit('Tag and Cargo workspace version disagree')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if sha != os.environ['GITHUB_SHA']:
              raise SystemExit('Checkout does not match the dispatch commit')
          remote = subprocess.check_output(
              ['git', 'ls-remote', '--refs', 'origin', 'refs/heads/main', f'refs/tags/{tag}'],
              text=True)
          refs = dict(line.split()[::-1] for line in remote.splitlines())
          if refs.get('refs/heads/main') != sha:
              raise SystemExit('Dispatch commit is no longer the tip of main; start a new run')
          if f'refs/tags/{tag}' in refs:
              raise SystemExit('This tag already exists; choose a new, unused tag')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write(f'tag={tag}\nsha={sha}\n')
          PY

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.prepare.outputs.sha }}
      pipewire_smoke: true

  publish:
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: voice-app-linux-candidate
          path: dist
      - name: Verify release files
        id: files
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          name = f'voice-app-{version}-x86_64-unknown-linux-gnu.tar.gz'
          if {p.name for p in Path('dist').iterdir()} != {name, 'SHA256SUMS.txt'}:
              raise SystemExit('Unexpected release assets')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write(f'archive=dist/{name}\n')
          PY
          cd dist
          sha256sum --check SHA256SUMS.txt
      - name: Publish verified assets under a new tag
        env:
          ARCHIVE: ${{ steps.files.outputs.archive }}
        run: |
          release_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name')
          if grep -Fxq -- "$TAG" <<< "$release_tags"; then
            echo 'A release or draft already uses this tag; choose a new tag.' >&2
            exit 1
          fi

          main_head=$(git ls-remote --exit-code --refs origin refs/heads/main)
          if [ "$main_head" != "$(printf '%s\trefs/heads/main' "$SOURCE_SHA")" ]; then
            echo 'main advanced during checks; start a new run before publishing.' >&2
            exit 1
          fi

          # A create-only ref prevents reusing a tag added while checks were running.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$SOURCE_SHA" >/dev/null

          # With assets, gh creates a draft, uploads to that new release, then publishes it.
          gh release create "$TAG" "$ARCHIVE" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$SOURCE_SHA" \
            --prerelease --latest=false \
            --title "Voice App $TAG — Linux experimental" \
            --notes-file docs/RELEASE-NOTES.md
